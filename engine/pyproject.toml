[project]
name = "yesrule"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harshit Makraria", email = "harshitmakraria9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
yesrule = "yesrule:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
