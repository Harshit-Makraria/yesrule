name: ci
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run python stress/fuzz.py --cases 100000 --seed ${{ github.run_number }}
  n8n-node:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: integrations/n8n-nodes-yesrule } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yesrule ./engine
